<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor console | Math Inquirers</title>
<link rel="stylesheet" href="/fonts.css"><style>body{margin:0;background:#FFF8E7;color:#1B2A49;font:17px/1.5 'Nunito Sans',Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px}main{max-width:44rem;margin:0 auto}h1{font:600 34px Fredoka,Arial}a.btn{display:inline-block;margin:4px 6px 4px 0;padding:10px 14px;border:2px solid #1B2A49;border-radius:12px;background:#fff;text-decoration:none;color:#1B2A49;font-weight:700}code{background:#fff;padding:2px 6px;border-radius:6px}</style></head><body><main>
<h1>Tutor console</h1><p>Open a lesson on your laptop, then connect your phone as the remote. Share only the lesson window in your video call.</p><div id="list">Loading lessons…</div>
<h2 style="font:600 20px Fredoka,Arial">On your phone</h2><p>Open <code id="rurl"></code> and type the code shown on the lesson screen.</p></main>
<script>document.getElementById('rurl').textContent=location.host+'/remote.html';
fetch('/data/index.json').then(function(r){return r.json()}).then(function(d){var l=document.getElementById('list');l.textContent='';d.lessons.forEach(function(x){var a=document.createElement('a');a.className='btn';a.href='/screen.html?lesson='+x.id;a.target='_blank';a.textContent=x.label;l.appendChild(a)})}).catch(function(){document.getElementById('list').textContent='No lessons built yet. Run build_data.py.'});</script></body></html>
