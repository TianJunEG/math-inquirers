<style>
/* Layout: squared-paper page; navy hero with an illustrated maths scene; colour-blocked sections with chunky offset-shadow cards; 1120px column. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --sky:#1D3150; --soft:#3A3217; --peach:#41271F; --mint:#173A2F; --lilac:#2B2650;
  --tealsoft:#173A3A; --redsoft:#47242A; --greysoft:#253149; --btn:#FFC93C; --btnfg:#1B2A49; --teal:#5FC5B5; --red:#F07B7B; --hero:#0A1120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --grid:#18233A; --card:#18233A; --fg:#EEF2F8; --muted:#A6B1C6; --ink:#8EA2C8; --line:#2C3A55;
  --sky:#1D3150; --soft:#3A3217; --peach:#41271F; --mint:#173A2F; --lilac:#2B2650;
  --tealsoft:#173A3A; --redsoft:#47242A; --greysoft:#253149; --btn:#FFC93C; --btnfg:#1B2A49; --teal:#5FC5B5; --red:#F07B7B; --hero:#0A1120; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--fg);font:16px/1.55 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

p{margin:0} ul{margin:0}
a{color:inherit}
mark{background:linear-gradient(transparent 58%,var(--yellow) 58%,var(--yellow) 92%,transparent 92%);color:inherit;padding:0 .08em}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:18px 0 12px}

.brand i{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:#1B2A49;display:grid;place-items:center;font-style:normal;font-size:22px;border:2.5px solid #1B2A49;box-shadow:3px 3px 0 #1B2A49;transform:rotate(-6deg)}

.btn{font:800 15.5px var(--body);background:var(--btn);color:var(--btnfg);border:2.5px solid var(--btn);border-radius:14px;padding:11px 20px;cursor:pointer;display:inline-block;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}

.btn.yel{background:var(--yellow);color:#1B2A49;border-color:#1B2A49;box-shadow:0 4px 0 #1B2A49}

main{padding:22px 0 50px;display:grid;gap:56px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px}

.shead{display:grid;gap:10px;max-width:720px}

.hero{background:var(--hero);color:var(--herofg);border-radius:32px;padding:clamp(26px,4vw,52px);display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;position:relative;overflow:hidden;border:2.5px solid #1B2A49;box-shadow:8px 8px 0 var(--yellow)}
.hero .lead{color:var(--herosub)}
.hero .eyebrow{background:var(--yellow);color:#1B2A49;border-color:#1B2A49}
.slogan{font-family:var(--head);font-size:24px;color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{font:800 13px var(--body);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.1);color:var(--herofg);border:1.5px solid rgba(255,255,255,.35)}
.art{width:100%;height:auto;max-width:540px;justify-self:center}
.art text{font-family:var(--head)}
@media (prefers-reduced-motion:no-preference){
  .frog{animation:bob 2.4s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
  .hop{stroke-dasharray:7 7;animation:dash 1.6s linear infinite}
  .wob{animation:wob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
}
@keyframes bob{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px)}60%{transform:translateY(0)}}

/* sticker facts */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fact{border:2.5px solid var(--ink);border-radius:20px;padding:16px 18px;box-shadow:5px 5px 0 var(--ink);color:#1B2A49}
.fact:nth-child(1){background:#FFF0C4;transform:rotate(-1.5deg)} .fact:nth-child(2){background:#D6E9FB;transform:rotate(1deg)} .fact:nth-child(3){background:#D3F1E4;transform:rotate(-.8deg)} .fact:nth-child(4){background:#FFE2D6;transform:rotate(1.4deg)}
.fact .v{font:600 30px var(--head)}

.lesson:nth-child(5n+1){background:#FFF0C4} .lesson:nth-child(5n+2){background:#D6E9FB} .lesson:nth-child(5n+3){background:#D3F1E4} .lesson:nth-child(5n+4){background:#FFE2D6} .lesson:nth-child(5n+5){background:#E6DFFB}

/* forms */

input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}

.seg input,.check input{width:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.check input{margin-top:4px;accent-color:var(--teal)}
.opt{display:grid;gap:8px}
.opt label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}

.rates{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px 12px;align-items:center}

.subtabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--line);padding-bottom:10px}

.faq{max-width:820px}

@media (max-width:820px){.hero,.two,.two.wide,.band,.grid2,footer{grid-template-columns:1fr}.three{grid-template-columns:1fr}.nav{margin-left:0;border-radius:18px}.hero{box-shadow:5px 5px 0 var(--yellow)}}

.voucher{display:grid;gap:2px;justify-items:center;text-align:center;border:2.5px dashed var(--ink);border-radius:18px;padding:16px;background:var(--mint)}

</style>

/* ---------- helpers ---------- */
function now(){return Date.now()+S.offset*DAY}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function fmt(ts){return new Date(ts).toLocaleDateString("en-SG",{day:"numeric",month:"short",year:"numeric"})}
function money(n){n=Math.round(Number(n)*100)/100;return "S$"+(n%1?n.toFixed(2):n.toFixed(0))}
function split(t){var c=Math.round(t*S.rules.cashPct)/100;return{cash:c,credit:Math.round((t-c)*100)/100}}
function isCash(l){return l.kind==="cash"}
function acct(id){return S.accounts.find(function(a){return a.id===id})}
function acctByEmail(e){return S.accounts.find(function(a){return a.email===e})}
function byCode(c){c=(c||"").trim().toUpperCase();return c?S.accounts.find(function(a){return a.code===c}):null}
function mkCode(name){var base=(name.replace(/[^A-Za-z]/g,"").toUpperCase()+"XXXX").slice(0,4),c;do{c=base+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}while(S.accounts.some(function(a){return a.code===c}));return c}
function balance(id){return S.ledger.filter(function(l){return l.accountId===id&&!isCash(l)}).reduce(function(s,l){return s+l.amount},0)}
function cashDue(id){return S.ledger.filter(function(l){return l.accountId===id&&isCash(l)}).reduce(function(s,l){return s+l.amount},0)}
function daysLeft(r){return Math.ceil((r.joinedAt+S.rules.windowDays*DAY-now())/DAY)}
function validEmail(e){return /^\S+@\S+\.\S+$/.test(e)}
function maskEmail(e){var p=String(e||"").split("@");return p.length<2?"":p[0].slice(0,2)+"•••@"+p[1]}
function sess(id){return S.sessions.find(function(s){return s.id===id})}
function taken(id){return S.enrolments.filter(function(e){return e.sessionId===id&&(e.status==="paid"||e.status==="awaiting")}).length}
function seatsLeft(s){return Math.max(0,(s.cap||8)-taken(s.id))}
function status(r){
  var credited=r.conversions.some(function(c){return c.credit>0}),dl=daysLeft(r);
  if(credited)return{k:"ok",t:"Converted"};
  if(dl<=0)return{k:"end",t:"Window ended"};
  return{k:"wait",t:r.kind==="list"?"On mailing list":"Signed up"};
}
function seatDots(s){var t=taken(s.id),c=s.cap||8,o="";for(var i=0;i<c;i++)o+='<i class="'+(i<t?"f":"")+'"></i>';return '<div class="seats" aria-label="'+t+' of '+c+' seats taken">'+o+'</div>'}

/* ---------- storage ---------- */
function save(){var j=JSON.stringify(S);lastJson=j;if(dbDoc){dbDoc.set(JSON.parse(j)).catch(function(){ui.toast={k:"no",t:"Could not save. Check your connection and try again."};render()})}}
function load(d){if(!d)return;var b=blank();Object.keys(b).forEach(function(k){if(d[k]!==undefined)b[k]=d[k]});b.rules=Object.assign(defRules(),d.rules||{});if(!(d.rules&&d.rules.cashoutRate)){b.rules.cashPct=0;b.rules.cashoutRate=3;b.rules.cashoutBlock=30}b.rules.rates=Object.assign(defRules().rates,b.rules.rates||{});S=b}

/* ---------- referral core ---------- */
function attach(email,name,code,kind){
  code=(code||"").trim();if(!code)return null;
  var ref=byCode(code);
  if(!ref)return{k:"info",t:"The referral code "+code.toUpperCase()+" was not found, so no referral was recorded."};
  if(ref.email===email)return{k:"info",t:"You cannot use your own referral code."};
  if(acctByEmail(email))return{k:"info",t:"Referral codes are for new families, and this email already has an account."};
  var ex=S.referrals.find(function(r){return r.email===email});
  if(ex)return ex.referrerId===ref.id?null:{k:"info",t:"This email was already referred by someone else, who keeps the referral."};
  S.referrals.push({id:uid("r"),referrerId:ref.id,name:name,email:email,kind:kind,joinedAt:now(),conversions:[]});
  return{k:"ok",t:"Referred by "+ref.name+"."};
}
function conv(email,product,channel,who){
  var r=S.referrals.find(function(x){return x.email===email});if(!r)return null;
  var ref=acct(r.referrerId);if(!ref)return null;
  var c={id:uid("c"),ts:now(),product:product,channel:channel,credit:0,note:""};
  if(daysLeft(r)<=0)c.note="Outside the "+S.rules.windowDays+"-day window";
  else if(S.rules.firstOnly&&r.conversions.some(function(x){return x.credit>0}))c.note="Already rewarded once";
  else{c.credit=S.rules.rates[ref.role][product]||0;c.note=channel==="email"?"Bought through a weekly email":channel==="link"?"Through the referral link":"Through the website";}
  r.conversions.push(c);
  var sp=split(c.credit),nt=(who||r.name)+" · "+PRODUCTS[product].name;
  if(sp.credit>0)S.ledger.push({id:uid("l"),ts:now(),accountId:ref.id,amount:sp.credit,kind:"credit",type:"earn",refId:r.id,note:nt});
  if(sp.cash>0)S.ledger.push({id:uid("l"),ts:now(),accountId:ref.id,amount:sp.cash,kind:"cash",type:"earn",refId:r.id,note:nt});
  return c.credit>0?ref.name+" earned "+money(c.credit)+" ("+money(sp.cash)+" cash + "+money(sp.credit)+" credit).":"No referral reward: "+c.note.toLowerCase()+".";
}

  if(!name||!validEmail(email)){toast("no","Enter your name and a valid email address.");return render()}

function enrol(){
  var f=ui.f.enrol,email=f.email.trim().toLowerCase(),code=f.code||ui.visitRef,s=sess(f.session);
  if(!f.parent.trim()||!validEmail(email)||!f.mobile.trim()||!f.child.trim()){toast("no","Fill in the parent's name, email, mobile and the child's name.");return render()}
  if(!s){toast("no","Choose a class.");return render()}
  if(!f.consent){toast("no","Tick the consent box to continue.");return render()}
  var full=seatsLeft(s)<=0,a=acctByEmail(email),use=0,vv=voucher(f.voucher),vd=0;
  if(f.voucher.trim()&&(!vv||vv.usedAt)){toast("no",!vv?"That voucher code was not found. Check it or leave the box empty.":"That voucher has already been used.");return render()}
  if(!full&&vv){vd=Math.min(vv.value,PRODUCTS.program.price);vv.usedAt=now()}
  if(!full&&f.useCredits&&a)use=Math.min(balance(a.id),PRODUCTS.program.price-vd);
  var ch=ui.fromEmail?"email":(code?"link":"website");
  var m=attach(email,f.parent.trim(),code,"program");
  var e={id:uid("e"),ts:now(),parent:f.parent.trim(),email:email,mobile:f.mobile.trim(),child:f.child.trim(),level:f.level,sessionId:s.id,code:(code||"").toUpperCase(),channel:ch,status:full?"waitlist":"awaiting",creditsUsed:use,voucher:vd?vv.code:"",voucherOff:vd,due:PRODUCTS.program.price-use-vd,notes:f.notes.trim()};
  S.enrolments.push(e);
  if(use>0)S.ledger.push({id:uid("l"),ts:now(),accountId:a.id,amount:-use,kind:"credit",type:"redeem",note:"Used on Math Inquirers for "+e.child});
  save();
  ui.done.enrol={e:e,m:m};
  ui.f.enrol=Object.assign(ui.f.enrol,{child:"",notes:"",consent:false,useCredits:false,code:"",voucher:""});render();window.scrollTo(0,0);
}

function markPaid(kind,id){
  var x=kind==="e"?S.enrolments.find(function(e){return e.id===id}):S.orders.find(function(o){return o.id===id});if(!x||x.status==="paid")return;
  x.status="paid";x.paidAt=now();
  var r=conv(x.email,kind==="e"?"program":"kit",x.channel,kind==="e"?x.parent+" ("+x.child+")":x.name);
  save();toast("ok","Marked as paid."+(r?" "+r:""));render();
}
function approveTutor(id){
  var t=S.tutorApps.find(function(x){return x.id===id});if(!t)return;t.status="approved";
  var a=acctByEmail(t.email);
  if(!a){a={id:uid("a"),name:t.name,email:t.email,role:"tutor",code:mkCode(t.name),createdAt:now()};S.accounts.push(a)}else a.role="tutor";
  save();toast("ok",t.name+" approved. Their tutor referral code is "+a.code+".");render();
}
function redeem(){
  var a=acct(ui.me),n=Math.floor(Number(ui.redeem));if(!a)return;
  if(!n||n<1){toast("no","Enter how many credits to use.");return render()}
  if(n>balance(a.id)){toast("no","You only have "+money(balance(a.id))+" in credits.");return render()}
  S.ledger.push({id:uid("l"),ts:now(),accountId:a.id,amount:-n,kind:"credit",type:"redeem",note:"Credits used on a purchase"});save();
  ui.redeem="";toast("ok",money(n)+" in credits will come off your next payment.");render();
}
function payout(id){var a=acct(id),d=cashDue(id);if(!a||d<=0)return;S.ledger.push({id:uid("l"),ts:now(),accountId:id,amount:-d,kind:"cash",type:"payout",note:"Cash paid out"+(a.paynow?" by PayNow to "+a.paynow:"")});save();toast("ok","Marked "+money(d)+" as paid to "+a.name+".");render()}
function savePaynow(){var a=acct(ui.me);if(!a)return;var v=(ui.paynow||"").trim();if(!v){toast("no","Enter a PayNow mobile number or UEN.");return render()}a.paynow=v;save();toast("ok","PayNow details saved.");render()}
function cashOut(){var a=acct(ui.me);if(!a||a.role!=="tutor")return;var B=S.rules.cashoutBlock||30,K=S.rules.cashoutRate||3,bal=balance(a.id),n=Math.floor(bal/B)*B;
  if(n<B){toast("no","You need at least "+B+" credits to cash out.");return render()}
  var cash=Math.round(n/K*100)/100,ts=now();S.ledger.push({id:uid("l"),ts:ts,accountId:a.id,amount:-n,kind:"credit",type:"cashout",note:"Credits cashed out"});
  S.ledger.push({id:uid("l"),ts:ts,accountId:a.id,amount:cash,kind:"cash",type:"cashout",note:"From "+n+" credits cashed out ("+K+" credits = S$1)"});
  save();toast("ok",n+" credits moved to "+money(cash)+" cash. It will be paid with the next PayNow payout.");render()}

function check(id){var p=pz(id),st=ui.pz[id]=ui.pz[id]||{};st.res=p.a.indexOf(norm(st.ans))>=0?"ok":"no";render()}
function submitPuzzle(id){
  var p=pz(id),f=ui.f.pzs,st=ui.pz[id]||{},email=f.email.trim().toLowerCase(),child=f.child.trim();
  if(!child||!validEmail(email)){toast("no","Enter your child's name and a valid email.");return render()}
  if(!norm(st.ans)){toast("no","Type your answer in the box first.");return render()}
  if(!f.consent){toast("no","Tick the consent box to send your entry.");return render()}
  var wk=weekKey(),dup=S.submissions.find(function(s){return s.email===email&&norm(s.child)===norm(child)&&s.week===wk&&s.correct});
  var ok=p.a.indexOf(norm(st.ans))>=0;
  var s={id:uid("z"),ts:now(),week:wk,puzzle:id,level:p.level,child:child,email:email,answer:st.ans,why:f.why.trim(),correct:ok,reward:null,code:ui.visitRef||""};
  var res={k:"info",t:""};
  if(ok&&!dup){
    if(S.rules.puzzleReward==="trial"){s.reward="trial";res={k:"ok",t:"Correct! "+child+" has won a free trial lesson. We will email you to book a time."}}
    else{var v={code:"PUZ-"+Math.random().toString(36).slice(2,6).toUpperCase(),value:S.rules.voucherValue,email:email,child:child,issuedAt:now(),usedAt:null};S.vouchers.push(v);s.reward=v.code;res={k:"ok",t:"Correct! "+child+" has won a "+money(v.value)+" voucher. Use it when you enrol.",code:v.code,val:money(v.value)+" off any program · valid 60 days"}}
  } else if(ok){res={k:"info",t:"Correct again! "+child+" already has this week's prize. Come back next Sunday for a new puzzle."}}
  else res={k:"no",t:"Thanks for entering. That answer is not right yet. Try the hint and send it again."};
  S.submissions.push(s);
  if(!S.subscribers.some(function(x){return x.email===email})){S.subscribers.push({id:uid("s"),name:"Parent of "+child,email:email,level:p.level,interests:["Maths puzzles"],joinedAt:now(),code:(ui.visitRef||"").toUpperCase()});attach(email,"Parent of "+child,ui.visitRef,"list")}
  save();ui.done["pz_"+id]=res;if(ok)ui.f.pzs.why="";render();
}

  return '<section class="sec"><h2>Classes</h2>'+(S.sessions.length?'<div class="tbl"><table><thead><tr><th>Class</th><th>Mode</th><th>When</th><th>Starts</th><th class="num">Seats</th><th></th></tr></thead><tbody>'+S.sessions.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b>'+(s.venue?'<div class="muted small">'+esc(s.venue)+'</div>':'')+'</td><td>'+esc(s.mode)+'</td><td>'+esc(s.days)+', '+esc(s.time)+'</td><td>'+esc(s.start)+'</td><td class="num">'+taken(s.id)+' / '+(s.cap||8)+'</td><td><button class="btn sm alt" data-toggle="'+s.id+'">'+(s.open===false?"Reopen":"Close")+'</button></td></tr>'}).join("")+'</tbody></table></div>':'<div class="card empty">No classes yet. Add the first one below.</div>')+'</section>'+
  '<form class="card" id="clsForm" style="max-width:760px"><h3>Add a class</h3><div class="grid2" style="margin-top:12px">'+fld("Name","c-n",inp("c-n","f.cls.name",f.name,"",'placeholder="e.g. Group D"'))+fld("Mode","c-m",'<select id="c-m" data-bind="f.cls.mode">'+["Online"].map(function(y){return '<option'+(y===f.mode?" selected":"")+'>'+y+'</option>'}).join("")+'</select>')+fld("Days","c-d",inp("c-d","f.cls.days",f.days,"",'placeholder="e.g. Tue & Fri"'))+fld("Time","c-t",inp("c-t","f.cls.time",f.time,"",'placeholder="e.g. 2:30–4:00pm"'))+fld("Start date","c-s",inp("c-s","f.cls.start",f.start,"",'placeholder="e.g. Tue 24 Nov 2026"'))+fld("Venue","c-v",inp("c-v","f.cls.venue",f.venue))+fld("Seats","c-c",inp("c-c","f.cls.cap",f.cap,"number",'min="1" max="12"'))+'</div><button class="btn" type="submit">Add class</button></form>';
}
function aList(){
  var L=S.subscribers.slice().sort(function(a,b){return b.joinedAt-a.joinedAt});
  var lv={};L.forEach(function(s){lv[s.level||"Not given"]=(lv[s.level||"Not given"]||0)+1});
  return '<section class="kpis"><div class="kpi main"><div class="v">'+L.length+'</div><div class="l">Subscribers</div></div>'+Object.keys(lv).slice(0,5).map(function(k){return '<div class="kpi"><div class="v">'+lv[k]+'</div><div class="l">'+esc(k)+'</div></div>'}).join("")+'</section>'+
  '<section class="sec"><h2>Mailing list</h2>'+(L.length?'<div class="tbl"><table><thead><tr><th>Joined</th><th>Name</th><th>Child level</th><th>Interests</th><th>Referral</th></tr></thead><tbody>'+L.map(function(s){var r=byCode(s.code);return '<tr><td>'+fmt(s.joinedAt)+'</td><td><b>'+esc(s.name)+'</b><div class="muted small">'+esc(s.email)+'</div></td><td>'+esc(s.level||"–")+'</td><td class="small">'+esc((s.interests||[]).join(", ")||"–")+'</td><td>'+(r?esc(r.name):'–')+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="card empty">No subscribers yet.</div>')+'<p class="small muted">Everyone on this list ticked the consent box. Sending the weekly email itself would be done from an email service in the live version.</p></section>';
}
function aTutors(){
  var T=S.tutorApps.slice().sort(function(a,b){return b.ts-a.ts});
  return '<section class="sec"><h2>Tutor applications</h2>'+(T.length?'<div class="tbl"><table><thead><tr><th>Date</th><th>Name</th><th>Teaches</th><th>Experience</th><th>Mode</th><th>Status</th><th></th></tr></thead><tbody>'+T.map(function(t){var a=acctByEmail(t.email);return '<tr><td>'+fmt(t.ts)+'</td><td><b>'+esc(t.name)+'</b><div class="muted small">'+esc(t.email)+'<br>'+esc(t.mobile)+'</div></td><td>'+esc(t.subjects)+'</td><td>'+esc(t.years||"–")+'</td><td>'+esc(t.mode)+'</td><td>'+(t.status==="approved"?'<span class="pill p-ok">Approved</span>'+(a?'<div class="muted small">Code '+esc(a.code)+'</div>':''):'<span class="pill p-wait">New</span>')+'</td><td>'+(t.status==="new"?'<button class="btn sm teal" data-approve="'+t.id+'">Approve</button>':'')+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="card empty">No applications yet.</div>')+'<p class="small muted">Approving a tutor gives them a tutor account and referral code.</p></section>';
}
function aRefs(){
  var R=S.rules,sum=function(f){return S.ledger.filter(f).reduce(function(s,l){return s+l.amount},0)};
  var tot=sum(function(l){return !isCash(l)&&l.amount>0}),used=-sum(function(l){return !isCash(l)&&l.amount<0}),cashE=sum(function(l){return isCash(l)&&l.amount>0}),cashP=-sum(function(l){return isCash(l)&&l.amount<0});
  var owed=S.accounts.filter(function(a){return cashDue(a.id)>0});
  function num(id,path,val){return '<input id="'+id+'" type="number" min="0" data-bind="S.rules.'+path+'" value="'+val+'">'}
  return '<section class="kpis"><div class="kpi main"><div class="v">'+money(cashE-cashP)+'</div><div class="l">Cash to pay out</div></div><div class="kpi"><div class="v">'+money(cashP)+'</div><div class="l">Cash paid</div></div><div class="kpi"><div class="v">'+money(tot-used)+'</div><div class="l">Credits outstanding</div></div><div class="kpi"><div class="v">'+money(used)+'</div><div class="l">Credits used or cashed out</div></div><div class="kpi"><div class="v">'+S.accounts.length+'</div><div class="l">Referral accounts</div></div></section>'+
  '<section class="sec"><h2>Cash payouts due</h2>'+(owed.length?'<div class="tbl"><table><thead><tr><th>Account</th><th>PayNow</th><th class="num">Due</th><th></th></tr></thead><tbody>'+owed.map(function(a){return '<tr><td><b>'+esc(a.name)+'</b><div class="muted small">'+a.role+'</div></td><td>'+(a.paynow?esc(a.paynow):'<span style="color:var(--red)">Not given yet</span>')+'</td><td class="num"><b>'+money(cashDue(a.id))+'</b></td><td class="num"><button class="btn sm teal" data-pay="'+a.id+'">Mark as paid</button></td></tr>'}).join("")+'</tbody></table></div>':'<div class="card empty">No cash is owed right now.</div>')+'</section>'+
  '<section class="two"><div class="sec"><h2>Rules</h2><div class="card sec"><div class="grid2">'+fld("Window after sign-up (days)","rw",num("rw","windowDays",R.windowDays))+fld("Paid in cash (%), keep at 0","rc",num("rc","cashPct",R.cashPct))+fld("Credits per S$1 cash","rr",num("rr","cashoutRate",R.cashoutRate))+fld("Tutor cash-out block (credits)","rb",num("rb","cashoutBlock",R.cashoutBlock))+'</div>'+
  '<div class="rates"><span>Reward (S$)</span><span>Parent</span><span>Tutor</span><span>Program</span>'+num("r1","rates.parent.program",R.rates.parent.program)+num("r2","rates.tutor.program",R.rates.tutor.program)+'<span>Home kit</span>'+num("r3","rates.parent.kit",R.rates.parent.kit)+num("r4","rates.tutor.kit",R.rates.tutor.kit)+'</div>'+
  chk("r5","S.rules.firstOnly",R.firstOnly,"Reward only the first purchase per friend")+'<p class="muted small">Changes apply from now on. Past rewards stay as issued.</p></div></div>'+
  '<div class="sec"><h2>Safeguards</h2><div class="card"><ul style="padding-left:18px;display:grid;gap:6px"><li>People cannot use their own code.</li><li>One level only: rewards go to the person whose link or code was used, never further up.</li><li>If an enrolment is refunded, its referral reward is taken off the referrer\'s next payout.</li><li>Codes are for new families: an email with an account cannot be referred.</li><li>The first referrer of an email keeps it for the whole window.</li><li>No reward after day '+R.windowDays+', even from a weekly email.</li><li>Rewards are added only when payment is marked as received.</li><li>Cash is paid only to accounts with PayNow details.</li><li>Rewards are paid as credits (1 credit = S$1 off fees). Credits cannot be used for beta sessions. Only tutors can turn credits into cash, at '+R.cashoutRate+' credits for S$1, in full blocks of '+R.cashoutBlock+' credits.</li></ul></div></div></section>'+
  '<section class="sec"><h2>All referrals</h2>'+refTable(S.referrals.slice().sort(function(a,b){return b.joinedAt-a.joinedAt}),true)+'</section>'+
  '<section class="sec"><h2>All reward activity</h2>'+ledgerTable(S.ledger.slice().sort(function(a,b){return b.ts-a.ts}),true)+'</section>'+
  '<section class="row"><button class="btn alt sm" data-act="wipe">Clear all prototype data</button><span class="muted small">'+(ui.dbOn?'Saved in the shared prototype database.':'Shared storage is not available here, so changes last only in this tab.')+'</span></section>';
}

function render(){
  document.getElementById("nav").innerHTML=navHtml();
  document.getElementById("demo").innerHTML=demoHtml();
  document.getElementById("foot").innerHTML=footHtml();
  var v={home:homeView,puzzles:puzzlesView,"math-inquirers":miView,enrol:enrolView,emails:emailsView,refer:referView,tutors:tutorsView,admin:canAdmin?adminView:homeView}[ui.view]||homeView;
  var ae=document.activeElement,fid=ae&&ae.id&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)?ae.id:null,ss=null,se=null;
  try{if(fid&&ae.selectionStart!=null){ss=ae.selectionStart;se=ae.selectionEnd}}catch(x){}
  document.getElementById("view").innerHTML=v();
  if(fid){var el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(x){}}}
}
function go(v,anchor){ui.view=v;ui.done={};ui.pz={};render();try{history.replaceState(null,"","#"+v)}catch(e){}
  var el=anchor&&document.getElementById(anchor);if(el)el.scrollIntoView({behavior:"smooth"});else window.scrollTo(0,0)}

/* ---------- events ---------- */
function setPath(obj,path,val){var p=path.split("."),o=obj;for(var i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=val}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-lvl],[data-check],[data-hint],[data-go],[data-clock],[data-copy],[data-act],[data-me],[data-pay],[data-paid],[data-atab],[data-approve],[data-toggle],[data-pick],[data-scroll]");if(!t)return;
  var d=t.dataset;
  if(d.lvl){ui.pzLevel=d.lvl;render();return}
  if(d.check){check(d.check);return}
  if(d.hint){var hs=ui.pz[d.hint]=ui.pz[d.hint]||{};hs.hint=!hs.hint;render();return}
  if(d.act==="again-pz"){ui.done["pz_"+d.id]=null;render();return}
  if(d.go){e.preventDefault();go(d.go,d.anchor);return}
  if(d.scroll){var el=document.getElementById(d.scroll);if(el)el.scrollIntoView({behavior:"smooth"});return}
  if(d.pick){ui.f.enrol.session=d.pick;go("enrol");return}
  if(d.atab){ui.adminTab=d.atab;render();return}
  if(d.pay){payout(d.pay);return}
  if(d.paid){var p=d.paid.split(":");markPaid(p[0],p[1]);return}
  if(d.approve){approveTutor(d.approve);return}
  if(d.toggle){var s=sess(d.toggle);if(s){s.open=s.open===false;save();render()}return}
  if(d.clock!==undefined){S.offset=d.clock==="0"?0:S.offset+Number(d.clock);save();render();return}
  if(d.me){ui.me=d.me;ui.paynow=null;finishMe();return}
  if(d.copy){var done=function(){t.textContent="Copied"};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(d.copy).then(done,function(){t.textContent="Select the text to copy"});else t.textContent="Select the text to copy";return}
  var a=d.act;
  if(a==="signout"){ui.me=null;try{localStorage.removeItem("pl_me")}catch(x){}render()}
  else if(a==="savepaynow")savePaynow();
  else if(a==="cashout")cashOut();
  else if(a==="redeem")redeem();
  else if(a==="again-sub"){ui.done.sub=null;render()}
  else if(a==="again-kit"){ui.done.kit=null;render()}
  else if(a==="again-enrol"){ui.done.enrol=null;render()}
  else if(a==="wipe"){if(d.sure){var keepS=S.sessions.map(function(s){return Object.assign({},s)});S=blank();S.sessions=keepS;ui.me=null;save();toast("ok","All records cleared. Classes kept.");render()}else{d.sure="1";t.textContent="Click again to erase all records"}}
});
document.addEventListener("submit",function(e){if(e.target.id==="pzForm"){e.preventDefault();submitPuzzle(e.target.dataset.id);return}var id=e.target.id,fn={signupForm:signup,subForm:subscribe,enrolForm:enrol,kitForm:buyKit,tutorForm:applyTutor,clsForm:addClass}[id];if(fn){e.preventDefault();fn()}});
var LIVE={"f.enrol.voucher":1,"f.enrol.session":1,"f.enrol.useCredits":1,"visitRef":1,"fromEmail":1,"f.enrol.email":0};
function onInput(e){
  var t=e.target,b=t.dataset&&t.dataset.bind;if(!b)return;
  var val=t.type==="checkbox"?t.checked:t.value;
  if(b.indexOf("S.rules.")===0){if(t.type==="number")val=Number(val)||0;setPath(S,b.slice(2),val);if(S.rules.windowDays<1)S.rules.windowDays=1;save();if(t.type==="radio")render();return}
  setPath(ui,b,val);
  if(e.type==="change"&&(LIVE[b]||b==="f.enrol.email"))render();
}
document.addEventListener("input",onInput);document.addEventListener("change",onInput);
window.addEventListener("hashchange",function(){var h=(location.hash||"").slice(1);if(VIEWS.indexOf(h)>=0&&h!==ui.view){ui.view=h;render()}});

/* ---------- boot ---------- */
render();
(async function(){
  try{var u=await window.claude.use("user");if(u&&typeof u.canEdit==="function")canAdmin=!!u.canEdit()}catch(e){}
  try{
    var db=await window.claude.use("db");
    if(db){dbDoc=db.doc("app/state");ui.dbOn=true;
      dbDoc.onSnapshot(function(s){if(!s.exists)return;var d=s.data(),j=JSON.stringify(d);if(j===lastJson)return;lastJson=j;load(d);
        var ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.id&&ae.id!=="vr")return;render()},function(){ui.dbOn=false});}
  }catch(e){}
  render();
})();
})();
</script>
